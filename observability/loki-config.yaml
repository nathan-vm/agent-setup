# Loki config for this stack. Based on the local-config.yaml that ships in the
# image, with four deliberate deviations from the default — all of them caused by
# the transcript-exporter or by retention:
#
#   1. reject_old_samples: false
#      The exporter imports the entire transcript history on its first run. The
#      Loki default rejects any sample older than 7 days, which would throw away
#      exactly the history we want to import.
#
#   2. max_query_length / max_query_lookback uncapped
#      The default caps queries at 30 days. The exporter needs to look back to
#      resolve the account of old sessions, and the dashboard has long-window
#      panels.
#
#   3. 90-day retention
#      The default keeps data on disk forever. 90d matches the Prometheus
#      retention in this same stack.
#
#   4. High ingester.max_chunk_age, so the exporter's historical backfill is not
#      rejected as out-of-order writes (see the note on that block)

auth_enabled: false

server:
  http_listen_port: 3100

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2020-10-24
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

ingester:
  # The default (2h) only accepts out-of-order writes within 1h of the stream's
  # most recent sample. The transcript-exporter backfills weeks of history, and
  # with the default Loki rejects all of it with HTTP 400 as soon as the stream
  # has any recent line. 30 days of tolerance covers a full reimport.
  max_chunk_age: 720h

limits_config:
  # Historical transcript backfill (see note 1 at the top).
  reject_old_samples: false
  # No query-window cap (see note 2).
  max_query_length: 0s
  max_query_lookback: 0s
  # Real tool names, request_id, attributed tokens — everything the exporter
  # writes goes in as structured metadata, not as stream labels.
  allow_structured_metadata: true
  # Enables the volume endpoint Grafana uses in its label pickers.
  volume_enabled: true
  retention_period: 90d

compactor:
  working_directory: /loki/compactor
  delete_request_store: filesystem
  retention_enabled: true
  retention_delete_delay: 2h
  # 10m (the default). This was at 1m during an experiment with the delete API
  # that was abandoned — compacting every minute just wakes the CPU for nothing.
  compaction_interval: 10m
  # Zero = a delete request runs on the compactor's next cycle instead of waiting
  # out the default 24h cancellation window.
  #
  # This is NOT used by the normal flow: the transcript-exporter reimports by
  # switching stream names (EXPORTER_STREAM in .env), precisely because the
  # delete API turned out to be the wrong tool for replacing derived data — it
  # filters its time window at query time, and a request that has already been
  # processed cannot be removed, leaving that window blind forever on that stream.
  #
  # Kept at 0s so a manual delete (for debugging) takes effect in minutes rather
  # than a day. If you never delete manually, this line can go.
  delete_request_cancel_period: 0s

analytics:
  reporting_enabled: false
