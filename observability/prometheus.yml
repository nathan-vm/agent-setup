global:
  # 60s, not 15s: since the panels moved to Loki, Prometheus is mostly here to
  # list the accounts that exist (label_values). A 15s scrape was burning
  # battery on data that barely changes.
  scrape_interval: 60s
  evaluation_interval: 60s

scrape_configs:
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8889"]
