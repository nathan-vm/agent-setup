receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch: {}

exporters:
  # Claude Code cost/token metrics -> scraped by Prometheus.
  prometheus:
    endpoint: 0.0.0.0:8889
    resource_to_telemetry_conversion:
      enabled: true   # turns service.name / user.email / organization.id into labels

  debug:
    verbosity: basic

  # Claude Code tool_result/tool_decision events -> Loki, native OTLP ingestion.
  # This is where real MCP tool/server names live (tool_name = mcp__<server>__<tool>),
  # unlike the Prometheus metrics where user-configured MCP servers are redacted to "custom".
  otlphttp/loki:
    endpoint: http://loki:3100/otlp

service:
  telemetry:
    metrics:
      level: none
  pipelines:
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [prometheus]
    # Traces are still accepted so nothing breaks if a client sends them;
    # they only go to the collector log for now. Wire a real backend when needed.
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug]
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlphttp/loki, debug]
